map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 64k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location /graphql {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
  proxy_read_timeout 75s;
  proxy_buffering off;
 }
 location /auth/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
 }
 location = /actuator/health { proxy_pass http://backend:8080; }
 location /actuator/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
