name: teamflow
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: [ "127.0.0.1:55432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U teamflow -d teamflow" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    image: teamflow-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/teamflow
      DB_USER: teamflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
  web:
    image: teamflow-web:${IMAGE_TAG:-local}
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: [ "127.0.0.1:8088:8080" ]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
